<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:20px 24px;margin:0}.rows{display:flex;flex-direction:column;gap:14px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.lbl{font-size:11px;color:var(--muted-foreground);width:84px;flex-shrink:0;font-weight:500}.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const NS = window.FarnazDesignSystem_626f14;
Object.assign(window, NS);
function App(){
const band=(t,label)=><Section theme={t} rhythm="none" style={{padding:"18px 0"}}><Container><div className="row" style={{justifyContent:"space-between"}}><span className="text-h4">{label}</span><div className="row"><LinkUnderline className="text-sm">Read more</LinkUnderline><Button pill size="sm">Start a project</Button></div></div></Container></Section>;
return <div style={{margin:"-20px -24px"}}>
{band("light","theme=light")}{band("muted","theme=muted")}{band("dark","theme=dark")}{band("accent","theme=accent")}
<Section rhythm="none" style={{padding:"16px 0"}}><Container><Grid>{Array.from({length:12}).map((_,i)=><div key={i} style={{height:36,background:"var(--muted)",display:"flex",alignItems:"center",justifyContent:"center"}} className="text-xs text-muted">{i+1}</div>)}<div style={{gridColumn:"span 7",height:28,background:"var(--secondary)",border:"1px solid var(--border)"}} className="text-xs text-muted">span 7</div><div style={{gridColumn:"span 5",height:28,background:"var(--secondary)",border:"1px solid var(--border)"}} className="text-xs text-muted">span 5</div></Grid></Container></Section>
</div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script></body></html>
