<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;margin:0}.l{font-size:11px;color:var(--muted-foreground);font-weight:500}.m{font-family:var(--font-mono);font-size:11px;color:var(--muted-foreground)}</style></head><body><div style="display:flex;gap:24px;align-items:center"><div style="text-align:center"><div style="width:72px;height:56px;border:1px solid var(--foreground);border-radius:var(--radius-sm);background:var(--muted)"></div><div class="l" style="margin-top:6px;color:var(--foreground)">radius-sm</div><div class="m">1.2px</div></div><div style="text-align:center"><div style="width:72px;height:56px;border:1px solid var(--foreground);border-radius:var(--radius-md);background:var(--muted)"></div><div class="l" style="margin-top:6px;color:var(--foreground)">radius-md</div><div class="m">1.6px</div></div><div style="text-align:center"><div style="width:72px;height:56px;border:1px solid var(--foreground);border-radius:var(--radius-lg);background:var(--muted)"></div><div class="l" style="margin-top:6px;color:var(--foreground)">radius-lg</div><div class="m">2px</div></div><div style="text-align:center"><div style="width:72px;height:56px;border:1px solid var(--foreground);border-radius:var(--radius-xl);background:var(--muted)"></div><div class="l" style="margin-top:6px;color:var(--foreground)">radius-xl</div><div class="m">2.8px</div></div><div style="text-align:center"><div style="width:120px;height:56px;border:1px solid var(--foreground);border-radius:var(--radius-pill);background:var(--muted)"></div><div class="l" style="margin-top:6px;color:var(--foreground)">radius-pill</div><div class="m">999px</div></div></div></body></html>
