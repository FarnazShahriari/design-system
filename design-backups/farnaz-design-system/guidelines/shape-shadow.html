<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;margin:0}.l{font-size:11px;color:var(--muted-foreground);font-weight:500}.m{font-family:var(--font-mono);font-size:11px;color:var(--muted-foreground)}</style></head><body><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px"><div style="border:1px solid var(--border);padding:16px;height:96px"><div class="l">--border</div><div class="m">#e6e8eb · decorative</div></div><div style="border:1px solid var(--input);padding:16px;height:96px"><div class="l">--input</div><div class="m">#8b94a2 · 3:1 control edge</div></div><div style="padding:16px;height:96px;box-shadow:0 0 0 3px color-mix(in srgb,var(--ring) 50%,transparent);border:1px solid var(--ring)"><div class="l">focus ring</div><div class="m">3px ring/50 · neutral</div></div></div></body></html>
