<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;margin:0}.l{font-size:11px;color:var(--muted-foreground);font-weight:500}.m{font-family:var(--font-mono);font-size:11px;color:var(--muted-foreground)}</style></head><body><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:0"><div><div style="height:64px;background:#33658a;"></div><div class="l" style="margin-top:6px;color:var(--foreground)">--accent</div><div class="m">#33658a</div></div><div><div style="height:64px;background:#6aa0c8;"></div><div class="l" style="margin-top:6px;color:var(--foreground)">--accent (dark)</div><div class="m">#6aa0c8</div></div><div><div style="height:64px;background:#cf3723;"></div><div class="l" style="margin-top:6px;color:var(--foreground)">--destructive</div><div class="m">#cf3723</div></div><div><div style="height:64px;background:#bcd4e6;"></div><div class="l" style="margin-top:6px;color:var(--foreground)">--selection-bg</div><div class="m">#bcd4e6</div></div><div><div style="height:64px;background:#274c68;"></div><div class="l" style="margin-top:6px;color:var(--foreground)">--selection-bg (dark)</div><div class="m">#274c68</div></div><div><div style="height:64px;background:#8b94a2;"></div><div class="l" style="margin-top:6px;color:var(--foreground)">--input</div><div class="m">#8b94a2</div></div><div><div style="height:64px;background:#e6e8eb;border:1px solid var(--border);"></div><div class="l" style="margin-top:6px;color:var(--foreground)">--border</div><div class="m">#e6e8eb</div></div></div></body></html>
