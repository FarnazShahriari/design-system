<!-- @dsCard group="Colors" viewport="1000x300" name="Section grounds" subtitle="The three grounds a Section can declare: light, muted, dark" -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--background);font-family:var(--font-sans)}
  .grounds{display:grid;grid-template-columns:repeat(3,1fr)}
  .g{padding:32px 28px;min-height:300px;box-sizing:border-box}
</style></head>
<body>
<div class="grounds">
  <div data-section="light" class="g bg-background text-foreground">
    <p class="text-label text-muted-foreground">theme="light"</p>
    <p class="text-h3 mt-3">Paper. The default ground.</p>
    <p class="mt-2 text-sm text-muted-foreground">Most of every page sits here.</p>
    <div class="mt-6 border-t pt-5"><span class="inline-block rounded-pill bg-primary px-4 py-2 text-sm font-medium text-primary-foreground">Primary</span></div>
  </div>
  <div data-section="muted" class="g bg-background text-foreground">
    <p class="text-label text-muted-foreground">theme="muted"</p>
    <p class="text-h3 mt-3">One step deeper, for quiet bands.</p>
    <p class="mt-2 text-sm text-muted-foreground">Separates without shouting.</p>
    <div class="mt-6 border-t pt-5"><span class="inline-block rounded-pill bg-primary px-4 py-2 text-sm font-medium text-primary-foreground">Primary</span></div>
  </div>
  <div data-section="dark" class="g bg-background text-foreground">
    <p class="text-label text-muted-foreground">theme="dark"</p>
    <p class="text-h3 mt-3">The one black block per page.</p>
    <p class="mt-2 text-sm text-muted-foreground">Reserved for the key statement.</p>
    <div class="mt-6 border-t pt-5"><span class="inline-block rounded-pill bg-primary px-4 py-2 text-sm font-medium text-primary-foreground">Primary</span></div>
  </div>
</div>
</body></html>
