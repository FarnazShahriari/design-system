<!-- @dsCard group="Fonts" viewport="1000x390" name="Typefaces" subtitle="Inter for everything, Geist Mono for code and token names" -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:32px;background:var(--background);color:var(--foreground);font-family:var(--font-sans)}
  .faces{display:grid;grid-template-columns:3fr 2fr;gap:40px}
  .big{font-size:120px;line-height:1;font-weight:800;letter-spacing:-.03em}
  .weights{margin-top:20px;display:grid;gap:4px;font-size:22px}
  .meta{font-family:var(--font-mono);font-size:12px;color:var(--muted-foreground)}
</style></head>
<body>
<div class="faces">
  <div>
    <p class="text-label text-muted-foreground">Sans · --font-sans</p>
    <div class="big mt-3">Inter</div>
    <div class="weights">
      <div style="font-weight:400">Regular 400 <span class="meta">body, lead</span></div>
      <div style="font-weight:500">Medium 500 <span class="meta">labels</span></div>
      <div style="font-weight:700">Bold 700 <span class="meta">headings h2–h4</span></div>
      <div style="font-weight:800;letter-spacing:-.03em">ExtraBold 800 <span class="meta">statements: display, h1</span></div>
    </div>
  </div>
  <div style="font-family:var(--font-mono)">
    <p class="text-label text-muted-foreground" style="font-family:var(--font-sans)">Mono · --font-mono</p>
    <div class="mt-3" style="font-size:64px;line-height:1;font-weight:500">Geist<br>Mono</div>
    <div class="mt-5" style="font-size:15px;line-height:1.7">
      0123456789<br>
      --foreground: #0d0d0d;<br>
      &lt;Button size="sm" /&gt;
    </div>
    <p class="meta mt-4" style="font-family:var(--font-sans)">Code, token names and figures. Never for prose.</p>
  </div>
</div>
</body></html>
