# Publishes the design system to GitHub Packages.
#
# Two ways in, both deliberate — pushing to a branch never publishes, so
# "I edited a token" and "every site that installs this will get it" stay
# two separate acts:
#
#   1. Push a version tag:
#        npm version minor --workspace @farnazshahriari/design-system
#        git commit -am "design system 1.1.0" && git tag v1.1.0
#        git push && git push --tags
#
#   2. Run this workflow by hand, which publishes whatever version
#      package.json currently names and then creates the matching tag.
#      This is the route when you cannot push a tag yourself — an agent
#      sandbox, for instance, is usually scoped to one branch ref.
name: Publish design system

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # contents: write so a manual run can create the tag for what it published.
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # Writes the .npmrc that points the scope at GitHub Packages and
          # reads NODE_AUTH_TOKEN for auth.
          registry-url: https://npm.pkg.github.com
          scope: "@farnazshahriari"

      - run: npm ci

      # Publishing a broken theme is expensive to undo: npm versions are
      # immutable, so a bad token reaches every site that updates and the
      # only fix is another release. The showcase consumes the package the
      # same way a real site does, so the checks below are a genuine
      # rehearsal of the install, not a formality.

      # PageProps and LayoutProps are global types Next generates into
      # .next/types from the route files. A fresh checkout has no .next, so
      # tsc has to be given them first or it fails on every typed route —
      # a failure that never reproduces locally, where a build has already
      # run.
      - name: Generate Next route types
        run: npx next typegen

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Contrast (WCAG AA)
        run: npm run check:contrast

      - name: Skills in sync
        run: npm run check:skills

      - name: Build the showcase against the package
        run: npm run build

      - name: Check the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./packages/design-system/package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $GITHUB_REF_NAME says $tag, but package.json says $pkg."
            echo "Run: npm version <new> --workspace @farnazshahriari/design-system"
            exit 1
          fi
          echo "Publishing $pkg"
        if: github.event_name == 'push'

      - name: Publish
        run: npm publish --workspace @farnazshahriari/design-system
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A release should be findable in git, not only in the registry. A
      # tag-triggered run already has its tag and this does nothing; a
      # manual run creates it. It runs after the publish on purpose —
      # a tag pointing at a version that never shipped is worse than none.
      #
      # The existence check asks the remote rather than the local clone:
      # actions/checkout fetches no tags, so a local lookup would report
      # every tag as missing.
      - name: Tag the released version
        run: |
          version=$(node -p "require('./packages/design-system/package.json').version")
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
            echo "v$version already exists — nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$version" -m "Design system $version"
          git push origin "v$version"
          echo "Tagged v$version"
