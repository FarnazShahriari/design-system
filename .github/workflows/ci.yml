# Runs the same checks the publish workflow runs, but on every push — so a
# broken token or a failing contrast pair is caught here rather than at the
# moment it would reach every site that installs the package.
name: Checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # PageProps and LayoutProps are global types Next generates into
      # .next/types from the route files. A fresh checkout has no .next, so
      # tsc has to be given them first or it fails on every typed route —
      # a failure that never reproduces locally, where a build has already
      # run.
      - name: Generate Next route types
        run: npx next typegen

      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run check:contrast
      - run: npm run check:skills
      - run: npm run build
